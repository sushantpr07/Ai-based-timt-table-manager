services:
  - type: web
    name: dayleaf-api
    runtime: python
    buildCommand: "pip install -r apps/api/requirements.txt"
    startCommand: "cd apps/api && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: apps/api
      - key: AUTO_CREATE_SCHEMA
        value: "true"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: WEB_ORIGIN
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
