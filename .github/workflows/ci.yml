name: CampusFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backup-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/backup-postgres.mjs
      - run: node --test scripts/backup-postgres.test.mjs
      - run: node --check scripts/monitor-production.mjs
      - run: node --test scripts/monitor-production.test.mjs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Apply database migrations
        run: python -m alembic upgrade head
        env:
          DATABASE_URL: sqlite://
      - run: python -m pytest -q

  containers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./apps/api
          - image: web
            context: ./apps/web
    steps:
      - uses: actions/checkout@v4
      - name: Validate production Compose configuration
        if: matrix.image == 'api'
        run: docker compose --env-file .env.example -f compose.production.yml config -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: campusflow-${{ matrix.image }}:ci
