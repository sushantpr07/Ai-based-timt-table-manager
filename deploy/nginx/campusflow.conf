# Install in the Nginx http context (for example, /etc/nginx/conf.d/campusflow.conf).
# Replace both example.edu hostnames and install matching TLS certificates first.
limit_req_zone $binary_remote_addr zone=campusflow_signin:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=campusflow_signup:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=campusflow_recovery:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=campusflow_verify:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    listen [::]:80;
    server_name campusflow.example.edu api.campusflow.example.edu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name campusflow.example.edu;

    ssl_certificate /etc/letsencrypt/live/campusflow.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campusflow.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.campusflow.example.edu;

    ssl_certificate /etc/letsencrypt/live/api.campusflow.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.campusflow.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;

    location = /api/v1/events {
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:8000;
    }

    location = /api/v1/auth/sign-in {
        limit_req zone=campusflow_signin burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location = /api/v1/auth/sign-up {
        limit_req zone=campusflow_signup burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ ^/api/v1/auth/(forgot-password|reset-password)$ {
        limit_req zone=campusflow_recovery burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location ~ ^/api/v1/auth/(resend-verification|verify-email)$ {
        limit_req zone=campusflow_verify burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
    }
    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
